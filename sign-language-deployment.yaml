apiVersion: apps/v1
kind: Deployment
metadata:
  name: sign-language-deployment
  labels:
    app: sign-language
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sign-language
  template:
    metadata:
      labels:
        app: sign-language
    spec:
      containers:
      - name: sign-language
        image: hansikagollen/sign-language:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: sign-language-service
spec:
  type: NodePort
  selector:
    app: sign-language
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30002
